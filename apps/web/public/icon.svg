<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tab-shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="tab-f-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="tab-purple-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
  </defs>

  <g transform="translate(36, -30) scale(11)">
    <!-- Outer Purple Shield Border -->
    <path
      d="M6 10 L34 10 L40 22 L20 44 L0 22 Z"
      fill="url(#tab-purple-border)"
      stroke="#4C1D95"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Inner Orange Shield Fill -->
    <path
      d="M8 12.5 L32 12.5 L37 22 L20 40.5 L3 22 Z"
      fill="url(#tab-shield-bg)"
    />
    <!-- Stylized F Mark Shadow -->
    <path
      d="M10 16 H30 L26 22 H17 V25 H24 L21.5 30 H17 V35 L12 37 V16 Z"
      fill="#0369A1"
      opacity="0.45"
    />
    <!-- Stylized F Main Face -->
    <path
      d="M9.5 15.5 H29.5 L26 21.5 H16.5 V24.5 H23.5 L21 29.5 H16.5 V35.5 L11.5 36.5 V15.5 Z"
      fill="url(#tab-f-cyan)"
      stroke="#0284C7"
      stroke-width="0.75"
    />
    <!-- White Top Bevel Highlight -->
    <path
      d="M9.5 15.5 H29.5 L28 17.5 H11.5 V15.5 Z"
      fill="#FFFFFF"
      opacity="0.92"
    />
  </g>
</svg>
